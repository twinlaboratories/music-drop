<!DOCTYPE html>
<html lang="en">
<head>

<title>research diary</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden}
body{font-family:"HelveticaNeue-Black","Helvetica Neue",Helvetica,"Arial Black",Arial,sans-serif;font-weight:900;letter-spacing:-0.03em}
#sc{position:fixed;inset:0;overflow:auto;background:#000;transition:background-color .6s ease}

#title{margin:0;font-size:22px;letter-spacing:-0.04em}

body.focus #head{opacity:0;pointer-events:none}

.e{position:absolute;display:block;padding:0;border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-align:left;cursor:pointer;transition:left .7s cubic-bezier(.2,.8,.2,1),top .7s cubic-bezier(.2,.8,.2,1),width .7s cubic-bezier(.2,.8,.2,1),height .7s cubic-bezier(.2,.8,.2,1),opacity .35s ease}
.e img{display:block;width:100%;height:100%;object-fit:cover}
.e .tx{display:block;width:100%;height:100%;overflow:hidden;padding:22px 8px 10px;background:#000;color:#fff;border:1px solid #8a8a8a;font-size:12px;line-height:1.25;white-space:pre-wrap;overflow-wrap:anywhere}
.e time{position:absolute;top:0;left:0;max-width:100%;padding:calc(3px*var(--s,1)) calc(5px*var(--s,1));background:#000;color:#fff;font-size:calc(10px*var(--s,1));line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e .lab{display:none}
.e.tiny time{display:none}
#sc.focus .e.tiny time{display:block}
.e.off{opacity:0;pointer-events:none}
.e:focus-visible{outline:2px solid #EB008B;z-index:3}
#sc.focus .e time{top:100%;background:none;color:#000;padding:4px 0 0;font-size:11px}
#sc.focus .e .lab{display:inline}
#sc.focus .e .tx{padding:8px}
.notrans .e{transition:none!important}
#ftext{position:absolute;left:32px;right:32px;opacity:0;pointer-events:none;transition:opacity .4s ease;color:#000}
#sc.focus #ftext{opacity:1;pointer-events:auto;transition-delay:.35s}
.nt{position:absolute;opacity:0;pointer-events:none;color:#000;transition:opacity .3s ease}
.nt.on{opacity:1;transition:opacity .4s ease .35s}
.nt .nl{margin:0;font-size:clamp(20px,2.6vw,34px);line-height:1;letter-spacing:-0.04em}
.nt .nn{margin:10px 0 0;font-size:14px;line-height:1.35;letter-spacing:-0.01em;white-space:pre-wrap}
#ftext h2{margin:0;font-size:clamp(44px,10vw,132px);line-height:.9;letter-spacing:-0.06em}
#ftext .tag{margin:48px 0 0;max-width:16em;font-size:clamp(22px,3.2vw,40px);line-height:1;letter-spacing:-0.04em}
#ftext .body{margin:20px 0 0;max-width:46em;font-size:12px;line-height:1.3;letter-spacing:-0.01em;columns:2 16em;column-gap:24px;white-space:pre-wrap}
#cal{position:absolute;display:flex;flex-direction:column;transition:opacity .35s ease;color:#fff}
#sc.focus #cal{opacity:0;pointer-events:none}
#sc{scroll-snap-type:y proximity}
#sc.focus{scroll-snap-type:none}
.snap{position:absolute;left:0;width:1px;height:1px;scroll-snap-align:start}
#down{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);min-width:44px;min-height:44px;border:0;background:none;color:#fff;font:inherit;font-size:18px;cursor:pointer;z-index:5;transition:opacity .3s}
body.cal #down,body.focus #down{opacity:0;pointer-events:none}
#calhead{display:flex;align-items:flex-end;gap:14px;padding-bottom:10px}
#calnum{font-size:64px;line-height:.8;letter-spacing:-0.06em}
#calname{font-size:14px;padding-bottom:2px;flex:1}
#calhead button{min-width:44px;min-height:44px;border:1px solid #555;background:none;color:#fff;font:inherit;font-size:16px;cursor:pointer}
#calhead button:hover{border-color:#fff}
#caldow,#calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
#caldow span{font-size:11px;padding:0 0 4px 4px;color:#bdbdbd}
#calgrid{flex:1;border-top:1px solid #4a4a4a;border-left:1px solid #4a4a4a;min-height:0}
.day{position:relative;border-right:1px solid #4a4a4a;border-bottom:1px solid #4a4a4a;padding:3px 4px;min-width:0;min-height:0;overflow:hidden;font-size:12px}
.day.out{background:repeating-linear-gradient(135deg,#000 0 5px,#161616 5px 6px)}
.day.today .dn{background:#00FE07;color:#000;padding:0 3px}
.day .th{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.day .th button{padding:0;border:2px solid #fff;background:#000;cursor:pointer;display:block}
.day .th img{display:block;width:100%;height:100%;object-fit:cover}
.day .more{font-size:10px;color:#bdbdbd;margin-top:2px}
.day .ev{display:block;width:100%;margin-top:3px;padding:3px 4px;border:0;background:#fff;color:#000;font:inherit;font-size:10px;line-height:1.1;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .ev.sale{background:#00FE07}
.day .ev.out{background:#8a8a8a;text-decoration:line-through}
#wires{position:absolute;left:0;top:0;pointer-events:none;opacity:1;z-index:4;transition:opacity .5s ease .7s}
#sc.focus #wires{opacity:0;transition:opacity .15s}
#wires line{stroke-width:1.5;transition:opacity .15s}
#wires.dim line{opacity:.18}
#wires.dim line.hot{opacity:1;stroke-width:3}
#vlink{display:none;padding:10px 16px;background:#00FE07;color:#000;font-size:14px;text-decoration:none}
#vlink.on{display:inline-block}
#view{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:rgba(0,0,0,.94);color:#fff;z-index:10}
#view.on{display:flex}
#view img{max-width:100%;max-height:78vh}
#view p{margin:0;max-width:60ch;font-size:13px;line-height:1.3;white-space:pre-wrap;text-align:center}
#view button{position:absolute;top:16px;right:20px;min-width:44px;min-height:44px;border:0;background:none;color:#fff;font:inherit;font-size:14px;cursor:pointer}
@media (max-width:520px){#head{left:16px;top:8px}#title{font-size:17px}#calnum{font-size:44px}#back{left:4px;top:8px}#ftext{left:16px;right:16px}}
@media (prefers-reduced-motion:reduce){.e,#sc,#ftext,#head,#back,#cal,#wires{transition:none!important}}
</style>
</head>

<div id="logo" role="img" aria-label="The twins"></div>

<script src="entries.js"></script>
<script>

function layoutCal(){

function layoutMain(){
  var vw=sc.clientWidth,vh=sc.clientHeight,small=vw<=520,pad=small?16:32,top=small?64:84,H=Math.max(160,vh-top-24),cw=small?150:Math.min(220,Math.max(150,Math.round(H/3.6)));

function layoutFocus(g){
  var vw=sc.clientWidth,small=vw<=520,pad=small?16:32,n=g.items.length;
  if(g.layout==='list'){
    var tw0=small?96:vw<900?150:200,gapx=small?12:24,y0=small?64:84,P={},N={},txw=Math.min(680,vw-pad*2-tw0-gapx);

function pad2(n){return n<10?'0'+n:''+n;}

  items.forEach(function(it){if(!it.nt)return;var q=L.notes&&L.notes[it.e.id];if(q){it.nt.style.left=q.x+'px';it.nt.style.top=q.y+'px';it.nt.classList.add('on');}else it.nt.classList.remove('on');});
  items.forEach(function(it){var p=L.pos[it.e.id];if(p){it.p=p;place(it.el,p);it.el.classList.remove('off');it.el.tabIndex=0;}else{it.el.classList.add('off');it.el.tabIndex=-1;}});
  if(!animate){void stage.offsetWidth;stage.classList.remove('notrans');}
}
function render(animate){
  if(mode!=='focus'){
    var M=layoutMain(),C=layoutCal(),vh=sc.clientHeight;
    C.cal.y+=vh;
    var L={pos:M.pos,W:Math.max(M.W,C.W),H:vh+C.H};
    ftext.style.top='0px';document.getElementById('snap2').style.top=vh+'px';
    calEl.style.left=C.cal.x+'px';calEl.style.top=C.cal.y+'px';calEl.style.width=C.cal.w+'px';calEl.style.height=C.cal.h+'px';
    var nx=saved?saved.x:sc.scrollLeft,ny=saved?saved.y:sc.scrollTop;saved=null;
    go(L,nx,ny,animate);
    calP={cal:C.cal,pos:M.pos,W:L.W,H:L.H};
    buildCal(C.cal);drawWires(calP);
  }else{
    clearWires();
    var F=layoutFocus(cur);
    document.getElementById('ft').textContent=cur.title||cur.id;
    document.getElementById('fg').textContent=cur.tagline||'';document.getElementById('fg').style.display=cur.tagline?'':'none';
    document.getElementById('fb').textContent=cur.text||'';document.getElementById('fb').style.display=cur.text?'':'none';
    ftext.style.top=F.textY+'px';
    F.H=Math.max(sc.clientHeight,F.textY+ftext.offsetHeight+64);
    go(F,0,animate?0:sc.scrollTop,animate);
  }
}
var calP=null;
function setMode(m){mode=m;document.body.classList.toggle('focus',m==='focus');sc.classList.toggle('focus',m==='focus');}
function focus(g){saved0={x:sc.scrollLeft,y:sc.scrollTop};prev=mode;cur=g;setMode('focus');render(true);}
var saved0=null;
function unfocus(){if(mode!=='focus')return;saved=saved0;setMode(prev);render(true);cur=null;}
sc.addEventListener('scroll',function(){if(mode!=='focus')document.body.classList.toggle('cal',sc.scrollTop>sc.clientHeight*0.35);});
document.getElementById('down').addEventListener('click',function(){sc.scrollTo({top:sc.clientHeight,behavior:'smooth'});});
document.getElementById('calprev').addEventListener('click',function(){calM--;if(calM<0){calM=11;calY--;}buildCal(calP.cal);drawWires(calP);});
document.getElementById('calnext').addEventListener('click',function(){calM++;if(calM>11){calM=0;calY++;}buildCal(calP.cal);drawWires(calP);});
document.getElementById('back').addEventListener('click',unfocus);
sc.addEventListener('click',function(ev){if(mode==='focus'&&(ev.target===sc||ev.target===stage||ev.target===ftext))unfocus();});
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){render(false);},80);});
var view=document.getElementById('view'),vimg=document.getElementById('vimg'),last=null;
function openEvent(v,from){last=from;vimg.removeAttribute('src');vimg.style.display='none';
  document.getElementById('vtime').textContent=stamp(v.date)+(v.place?' - '+v.place:'')+(v.status?' - '+v.status:'');
  document.getElementById('vtext').textContent=(v.title||'')+(v.note?'\n\n'+v.note:'');
  var a=document.getElementById('vlink');if(v.url&&/^https?:/.test(v.url)&&v.status!=='sold out'){a.href=v.url;a.textContent=v.status==='on sale'?'buy tickets':'tickets';a.classList.add('on');}else a.classList.remove('on');
  view.classList.add('on');document.getElementById('close').focus();}
function openView(e,from){last=from;document.getElementById('vlink').classList.remove('on');
  if(e.img&&!e.broken){vimg.src=e.img;vimg.alt=e.alt||'';vimg.style.display='';}else{vimg.removeAttribute('src');vimg.style.display='none';}
  document.getElementById('vtime').textContent=stamp(e.date)+(e.label?' - '+e.label:'');
  document.getElementById('vtext').textContent=e.img?(e.note||''):(e.text||'');
  view.classList.add('on');document.getElementById('close').focus();}
function shut(){view.classList.remove('on');if(last)last.focus();}
view.addEventListener('click',function(ev){if(ev.target===view||ev.target.id==='close')shut();});
document.addEventListener('keydown',function(ev){if(ev.key!=='Escape')return;if(view.classList.contains('on'))shut();else unfocus();});
render(false);
if(location.hash==='#calendar'){sc.scrollTop=sc.clientHeight;}
})();
</script>
</body>
</html>
